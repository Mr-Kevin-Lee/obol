[package]
name = "obol-desktop"
version.workspace = true
edition.workspace = true

# A lib alongside the bin so the view-assembly logic in `view.rs` is
# unit-testable without launching a window (spec §5's test-first
# mandate applies to it — it's the only new logic in this crate).
[lib]
name = "obol_desktop"
path = "src/lib.rs"

[[bin]]
name = "obol-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
obol-core = { path = "../core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
